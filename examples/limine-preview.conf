# limine-preview/limine.conf
#
# Config de PRUEBA para ver el menu de Limine sin reiniciar.
# El script inyecta el wallpaper y la resolucion automaticamente.
#
# OJO: el formato de una entrada de menu es "/Nombre" (con "/" repetidos
# para anidar), NO "[Nombre]".
#
#     /CachyOS          → entrada de primer nivel
#     //linux-cachyos   → sub-entrada
#     ///380 │ fecha     → sub-sub-entrada
#     /+CachyOS         → grupo marcado como expandido
#
# Y recordá: las opciones GLOBALES van ANTES de la primera entrada. Despues
# de un "/", cualquier opcion pertenece a esa entrada y se ignora como global.

# ── Boot ────────────────────────────────────────────────────────────────────
# timeout: no = muestra el menu siempre (0 = bootea sin menu, 5 = cuenta 5s)
timeout: no
quiet: no
graphics: yes
mouse: yes
editor_enabled: yes

# ── Interfaz ────────────────────────────────────────────────────────────────
interface_branding: b3low-z3r0
interface_branding_colour: c4a7e7
interface_help_colour: 9ccfd8
interface_help_colour_bright: e0def4

# ── El "card" de Rosé Pine ──────────────────────────────────────────────────
# term_background lleva ALPHA en el primer byte (TT): B0 ≈ 69% de opacidad.
term_font_scale: 2x2
term_margin: 120
term_margin_gradient: 24
term_background: B01E1E2E
term_foreground: e0def4

# ── Paleta (separador ";" punto y coma, NO ",") ─────────────────────────────
term_palette: 191724;eb6f92;f6c177;9ccfd8;31748f;c4a7e7;ebbcba;6e6a86
term_palette_bright: 3a3a52;eb6f92;f6c177;9ccfd8;31748f;c4a7e7;ebbcba;e0def4

# ── Entradas ────────────────────────────────────────────────────────────────
# Los paths no importan: solo se ve el menu, no se bootea nada.

/CachyOS
protocol: linux
path: boot():/vmlinuz-linux
comment: Btrfs + Snapper

/Linux LTS
protocol: linux
path: boot():/vmlinuz-lts
comment: Kernel de largo plazo

/Windows 11
protocol: efi
path: boot():/EFI/Microsoft/Boot/BOOTX64.EFI

//Snapshots
protocol: linux
path: boot():/vmlinuz-linux
comment: Submenu de snapshots
