# ── Limine theming (b3l0wz3r0-os) ───────────────────────────────────────────
#
# Pegar esto en /etc/default/limine (NO en /boot/limine.conf, que se
# regenera). Después: sudo limine-mkinitcpio
#
# Ver el resultado antes de aplicar:
#     boot-preview loader shot /tmp/previo.png
#
# ── Wallpaper ───────────────────────────────────────────────────────────────
# Formatos: PNG, BMP, JPEG y QOI. Va en /boot (la particion FAT que Limine lee).
#
# Limine NO puede difuminar: la imagen llega a Limine YA difuminada, y Limine
# solo la muestra. Hay dos versiones:
#
#     la real        prepare-wallpapers  ->  wallpaper/rei.png
#     la difuminada  prepare-wallpapers  ->  wallpaper/rei-blur.png
#
# Para usar la difuminada en el Limine real:
#     prepare-wallpapers
#     sudo cp ~/.config/boot-preview/loader/wallpaper/rei-blur.png /boot/splash.png
#
# Para usar la real:
#     sudo cp ~/.config/boot-preview/loader/wallpaper/rei.png /boot/splash.png
wallpaper: boot():/splash.png
wallpaper_style: centered
backdrop: 191724

# ── El wallpaper se ve tal cual ─────────────────────────────────────────────
# El blur va PRE-RENDERIZADO en la imagen, no en Limine (su degradado de
# margen no es un blur, es un velo). Ver scripts/make-wallpaper.sh.
#
# El alpha de term_background va AL REVES de la doc oficial: TT=FF deja
# pasar el wallpaper limpio, TT=00 lo tapa con un recuadro negro.
term_margin: 0
term_margin_gradient: 0
term_background: FF191924
term_foreground: e0def4

# ── Paleta Rosé Pine ────────────────────────────────────────────────────────
# OJO: el separador es ";" (punto y coma), NO ",".
term_palette: 191724;eb6f92;f6c177;9ccfd8;31748f;c4a7e7;ebbcba;6e6a86
term_palette_bright: 3a3a52;eb6f92;f6c177;9ccfd8;31748f;c4a7e7;ebbcba;e0def4

# ── Fuente ──────────────────────────────────────────────────────────────────
# La fuente tiene que ser CP437 bitmap (.F16), NO TTF. Si no tenes una,
# comentá las 3 lineas de term_font y dejá solo el scale.
#     paru -S limine-font-converter
#     limine-font-converter -i MiFuente.ttf -o /boot/font.F16 -f 8x16
# term_font: boot():/font.F16
# term_font_size: 8x16
term_font_scale: 1

# ── Interfaz ────────────────────────────────────────────────────────────────
interface_resolution: 1920x1080
interface_branding: b3low-z3r0
interface_branding_colour: c4a7e7
interface_help_colour: 9ccfd8
interface_help_colour_bright: e0def4
